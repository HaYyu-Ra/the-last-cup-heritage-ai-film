name: Render The Last Cup — Amharic cinematic edition
on:
  push:
    paths:
      - "assets/**"
      - "pipeline/production.py"
      - "requirements.txt"
      - ".github/workflows/render.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate storyboard
        run: python -m pipeline.validate
      - name: Render cinematic videos with Amharic narration and music
        run: python -m pipeline.production
      - name: Verify video streams and audible audio
        run: |
          for f in outputs/final/*.mp4; do
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$f" | grep -q .
            ffprobe -v error -show_entries format=duration -of csv=p=0 "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: the-last-cup-amharic-cinematic
          path: |
            outputs/final/*.mp4
            outputs/audio/*
          if-no-files-found: error
          retention-days: 14
